[project]
name = "simpcity-scraper"
version = "0.1.0"
description = "A simpcity.cr scraping software."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "tldextract>=5.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
simpcity_scraper = "simpcity_scraper.__main__:main"
